name: Deploy to Server

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Build (minify)
      run: npm run build

    - name: Deploy via SSH
      uses: easingthemes/ssh-deploy@v4
      with:
        SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        REMOTE_HOST: ${{ secrets.SERVER_HOST }}
        REMOTE_USER: ${{ secrets.SERVER_USER }}
        REMOTE_PORT: ${{ secrets.SERVER_PORT }}
        SOURCE: "./"
        TARGET: ${{ secrets.SERVER_TARGET }}
        ARGS: "-rltgoDzvO --delete"
        EXCLUDE: "/node_modules/, /.git/, /.env"
        
    - name: Apply changes on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          cd ${{ secrets.SERVER_TARGET }}
          cp -r ${{ secrets.SERVER_TARGET }}/* /var/www/zumba-site/
          chown -R www-data:www-data /var/www/zumba-site/
          chmod 644 /var/www/zumba-site/send-form.php
          systemctl reload nginx
