server {
    listen 80;
    server_name zumba-spb.ru www.zumba-spb.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name zumba-spb.ru www.zumba-spb.ru;

    ssl_certificate /etc/letsencrypt/live/zumba-spb.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zumba-spb.ru/privkey.pem;

    root /var/www/html;
    index index.html index.php;

    # Безопасность заголовков
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Отключаем доступ к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Основной location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        
        # Кэширование статики
        location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(css|js)$ {
            expires 7d;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # Прокси для API Бота
    location /api/ {
        proxy_pass http://bot:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Ограничение методов
        limit_except POST OPTIONS {
            deny all;
        }
    }

    # Обработка PHP
    location ~ \.php$ {
        # Разрешаем только определенные скрипты (для безопасности)
        if ($uri !~ ^/(index\.php|admin/index\.php)$) {
            return 403;
        }

        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Запрет доступа к системным файлам
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|md|json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
