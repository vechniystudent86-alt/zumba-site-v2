# Nginx конфигурация для Zumba Site с PHP поддержкой
# Скопируйте в /etc/nginx/sites-available/zumba-site

server {
    listen 80;
    server_name zumba-spb.ru www.zumba-spb.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zumba-spb.ru www.zumba-spb.ru;

    # SSL настройки
    ssl_certificate /etc/letsencrypt/live/zumba-spb.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zumba-spb.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Корневая директория
    root /var/www/zumba-site;
    index index.html index.php;

    # Безопасность заголовков
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Отключаем доступ к敏感 файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Защита PHP файлов - разрешаем только send-form.php и index.php
    location ~* \.php$ {
        # Разрешаем только send-form.php и index.php
        if ($uri !~ ^/(send-form\.php|index\.php)$) {
            return 403;
        }

        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock; # Или ваша версия PHP
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;

        # Таймауты
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        # Буферы
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Основной location для статики
    location / {
        try_files $uri $uri/ =404;
        
        # Кэширование статики
        location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        location ~* \.(css|js)$ {
            expires 7d;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # Защита send-form.php от прямого вызова без POST
    location = /send-form.php {
        limit_req zone=form_limit burst=5 nodelay;
        
        if ($request_method !POST) {
            return 405;
        }
        
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }

    # Запрет доступа к backup файлам
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Логирование
    access_log /var/log/nginx/zumba-access.log;
    error_log /var/log/nginx/zumba-error.log warn;
}

# Rate limiting зона для форм
# Добавить в http блок в /etc/nginx/nginx.conf:
# limit_req_zone $binary_remote_addr zone=form_limit:10m rate=5r/m;
